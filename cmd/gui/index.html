<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InTunnel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0F172A 0%, #1E293B 50%, #0F172A 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f1f5f9;
        }
        
        .container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }
        
        .card {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 102, 255, 0.2);
            border-radius: 24px;
            padding: 40px 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        
        .header {
            text-align: center;
            margin-bottom: 32px;
        }
        
        .logo {
            font-size: 36px;
            font-weight: 700;
            background: linear-gradient(135deg, #0066FF, #00D9FF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 4px;
        }
        
        .logo-sub {
            font-size: 14px;
            font-weight: 500;
            color: #64748b;
            letter-spacing: 2px;
        }
        
        .version {
            font-size: 12px;
            color: #64748b;
            margin-top: 8px;
        }
        
        .form-group {
            margin-bottom: 24px;
        }
        
        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #94a3b8;
            margin-bottom: 8px;
        }
        
        .form-input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(100, 116, 139, 0.3);
            border-radius: 12px;
            color: #f1f5f9;
            font-size: 15px;
            font-family: 'JetBrains Mono', monospace;
            transition: all 0.3s ease;
        }
        
        .form-input:focus {
            outline: none;
            border-color: #0066FF;
            box-shadow: 0 0 0 3px rgba(0, 102, 255, 0.15);
        }
        
        .form-input::placeholder {
            color: #475569;
        }
        
        .btn {
            width: 100%;
            padding: 14px 24px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #0066FF, #00D9FF);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 102, 255, 0.3);
        }
        
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
        }
        
        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(239, 68, 68, 0.3);
        }
        
        .status-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 24px;
            font-size: 14px;
            font-weight: 500;
        }
        
        .status-ready {
            background: rgba(100, 116, 139, 0.1);
            color: #64748b;
        }
        
        .status-connecting {
            background: rgba(251, 191, 36, 0.1);
            color: #fbbf24;
        }
        
        .status-connected {
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
        }
        
        .status-error {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
        }
        
        .status-connected .status-dot {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .connection-info {
            display: none;
            background: rgba(16, 185, 129, 0.05);
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
        }
        
        .connection-info.active {
            display: block;
        }
        
        .tunnel-name {
            font-size: 18px;
            font-weight: 600;
            color: #f1f5f9;
            margin-bottom: 12px;
            text-align: center;
        }
        
        .public-url {
            display: block;
            text-align: center;
            color: #00D9FF;
            font-size: 14px;
            text-decoration: none;
            word-break: break-all;
            margin-bottom: 8px;
        }
        
        .public-url:hover {
            text-decoration: underline;
        }
        
        .local-port {
            text-align: center;
            font-size: 12px;
            color: #64748b;
        }
        
        .device-info {
            text-align: center;
            font-size: 11px;
            color: #475569;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid rgba(100, 116, 139, 0.2);
        }
        
        .device-info svg {
            width: 14px;
            height: 14px;
            vertical-align: middle;
            margin-right: 4px;
        }
        
        .help-link {
            display: block;
            text-align: center;
            color: #64748b;
            font-size: 12px;
            margin-top: 12px;
        }
        
        .help-link a {
            color: #0066FF;
            text-decoration: none;
        }
        
        .help-link a:hover {
            text-decoration: underline;
        }
        
        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <div class="logo">InTunnel</div>
                <div class="logo-sub">SECURE TUNNELING</div>
                <div class="version">Version {{.Version}}</div>
            </div>
            
            <div id="status-bar" class="status-bar status-ready">
                <span class="status-dot"></span>
                <span id="status-text">Ready to connect</span>
            </div>
            
            <div id="connection-info" class="connection-info">
                <div id="tunnel-name" class="tunnel-name"></div>
                <a id="public-url" class="public-url" href="#" target="_blank"></a>
                <div id="local-port" class="local-port"></div>
            </div>
            
            <div id="token-form" class="form-group">
                <label class="form-label">Tunnel Token</label>
                <input type="password" id="token" class="form-input" placeholder="Enter your tunnel token...">
            </div>
            
            <button id="connect-btn" class="btn btn-primary" onclick="connect()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M5 12h14M12 5l7 7-7 7"/>
                </svg>
                Connect
            </button>
            
            <button id="disconnect-btn" class="btn btn-danger hidden" onclick="disconnect()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2"/>
                </svg>
                Disconnect
            </button>
            
            <div class="device-info">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="2" y="3" width="20" height="14" rx="2"/>
                    <path d="M8 21h8M12 17v4"/>
                </svg>
                {{.DeviceName}}
            </div>
            
            <div class="help-link">
                Get your token at <a href="https://intunnel.cloud" target="_blank">intunnel.cloud</a>
            </div>
        </div>
    </div>
    
    <script>
        const statusBar = document.getElementById('status-bar');
        const statusText = document.getElementById('status-text');
        const connectionInfo = document.getElementById('connection-info');
        const tokenForm = document.getElementById('token-form');
        const tokenInput = document.getElementById('token');
        const connectBtn = document.getElementById('connect-btn');
        const disconnectBtn = document.getElementById('disconnect-btn');
        const tunnelName = document.getElementById('tunnel-name');
        const publicUrl = document.getElementById('public-url');
        const localPort = document.getElementById('local-port');
        
        function setStatus(status, text) {
            statusBar.className = 'status-bar status-' + status;
            statusText.textContent = text;
        }
        
        async function connect() {
            const token = tokenInput.value.trim();
            if (token.length < 10) {
                alert('Please enter a valid token');
                return;
            }
            
            setStatus('connecting', 'Connecting...');
            connectBtn.disabled = true;
            connectBtn.innerHTML = '<div class="spinner"></div> Connecting...';
            
            try {
                const response = await fetch('/connect', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: 'token=' + encodeURIComponent(token)
                });
                const data = await response.json();
                
                if (data.success) {
                    setStatus('connected', '● Connected');
                    tunnelName.textContent = data.tunnelName;
                    publicUrl.textContent = data.publicURL;
                    publicUrl.href = data.publicURL;
                    localPort.textContent = 'Forwarding to localhost:' + data.localPort;
                    
                    connectionInfo.classList.add('active');
                    tokenForm.classList.add('hidden');
                    connectBtn.classList.add('hidden');
                    disconnectBtn.classList.remove('hidden');
                } else {
                    setStatus('error', 'Connection failed');
                    alert(data.error || 'Connection failed');
                    connectBtn.disabled = false;
                    connectBtn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg> Connect';
                }
            } catch (err) {
                setStatus('error', 'Connection failed');
                alert('Failed to connect: ' + err.message);
                connectBtn.disabled = false;
                connectBtn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg> Connect';
            }
        }
        
        async function disconnect() {
            try {
                await fetch('/disconnect', { method: 'POST' });
            } catch (err) {}
            
            setStatus('ready', 'Ready to connect');
            connectionInfo.classList.remove('active');
            tokenForm.classList.remove('hidden');
            tokenInput.value = '';
            connectBtn.classList.remove('hidden');
            connectBtn.disabled = false;
            connectBtn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg> Connect';
            disconnectBtn.classList.add('hidden');
        }
        
        // Check status periodically
        setInterval(async () => {
            try {
                const response = await fetch('/status');
                const data = await response.json();
                if (!data.connected && disconnectBtn.classList.contains('hidden') === false) {
                    disconnect();
                }
            } catch (err) {}
        }, 5000);
        
        // Enter key to connect
        tokenInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') connect();
        });
    </script>
</body>
</html>
